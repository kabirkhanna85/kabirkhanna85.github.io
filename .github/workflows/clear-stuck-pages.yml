name: Clear stuck Pages deployment
on:
  push:
    branches: [website]
    paths:
      - .github/workflows/clear-stuck-pages.yml
permissions:
  pages: write
jobs:
  clear-stuck-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel the stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/pages/deployments/e1612e00dd77199a142de98cbc8f416b878a105b/cancel"
